<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图书商城</title>
    <!-- 引入外部CSS -->
    <link rel="stylesheet" href="lab2-2503-075-index.css">
    <style>
        /* 只加这一段登录弹窗样式，不影响你原有界面 */
        .mask{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.3);z-index:999;}
        .login-pop{display:none;position:relative;z-index:1000;}
        .login-box,.register-box{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:400px;background:#fff;padding:30px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,.2);}
        .register-box{display:none;}
        .input-item{margin-bottom:20px;}
        .input-item label{display:inline-block;width:70px;}
        .input-item input{width:280px;height:35px;padding:0 10px;border:1px solid #ccc;border-radius:5px;}
        .btn-box{text-align:center;}
        .btn-box button{
            padding:8px 15px;
            margin:0 5px;
            background:#409eff;
            color:#fff;
            border:none;
            border-radius:5px;
            cursor:pointer;
            /* 动画过渡 */
            transition: all 0.3s ease;
        }

        /* ====================== 实验3 新增动画样式 ====================== */
        /* 1. 热门图书悬停动效：右移 + 阴影加深 + 放大 */
        .book-item {
            transition: all 0.4s ease;
            cursor: pointer;
        }
        .book-item:hover {
            transform: translateX(10px) scale(1.08);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        /* 2. 轮播图区域 + 从下向上轮播动画 */
        .carousel {
            width: 100%;
            height: 250px;
            overflow: hidden;
            position: relative;
            margin-bottom: 20px;
            border-radius: 6px;
        }
        .carousel img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            position: absolute;
            animation: slideUp 8s infinite;
            opacity: 0;
        }
        .carousel img:nth-child(1) { animation-delay: 0s; }
        .carousel img:nth-child(2) { animation-delay: 2s; }
        .carousel img:nth-child(3) { animation-delay: 4s; }
        .carousel img:nth-child(4) { animation-delay: 6s; }

        /* 从下向上轮播关键帧 */
        @keyframes slideUp {
            0% { transform: translateY(100%); opacity: 0; }
            10% { transform: translateY(0); opacity: 1; }
            30% { transform: translateY(0); opacity: 1; }
            40% { transform: translateY(-100%); opacity: 0; }
            100% { transform: translateY(-100%); opacity: 0; }
        }

        /* 3. 登录按钮动画：背景渐变 + 缩放 */
        .nav li[onclick="showLogin()"] {
            transition: all 0.3s ease;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 4px;
        }
        .nav li[onclick="showLogin()"]:hover {
            transform: scale(1.1);
            background: linear-gradient(45deg, #409eff, #64b5f6);
            color: #fff;
        }

        /* 4. 购物车、搜索图标动画：悬停旋转 */
        .icon {
            display: inline-block;
            margin: 0 8px;
            font-size: 18px;
            transition: transform 0.4s ease;
            cursor: pointer;
        }
        .icon:hover {
            transform: rotate(360deg);
        }

        /* 基础布局样式（保证页面正常显示） */
        * {margin: 0; padding: 0; box-sizing: border-box; list-style: none;}
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .logo img {height: 45px; margin-right: 30px;}
        .nav {display: flex; gap: 25px; font-size: 16px;}
        .nav li {line-height: 60px;}

        .container {
            margin-top: 70px;
            display: flex;
            padding: 10px;
            gap: 10px;
        }
        .left {
            width: 200px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
        }
        .middle {
            flex: 1;
            padding: 15px;
        }
        .right {
            position: fixed;
            right: 10px;
            top: 80px;
            width: 180px;
            background: #fff3cd;
            padding: 15px;
            border-radius: 6px;
        }

        .book-box {margin: 15px 0;}
        .book-item {
            position: relative;
            width: 180px;
            height: 240px;
        }
        .book-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
        }
        .hot-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: red;
            color: #fff;
            padding: 2px 6px;
            font-size: 12px;
            border-radius: 3px;
        }
        .show-info {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.6);
            color: #fff;
            text-align: center;
            padding: 5px 0;
            font-size: 14px;
        }

        .recommend {
            display: flex;
            gap: 15px;
            margin: 15px 0;
        }
        .rec-item {
            width: 120px;
            height: 60px;
            background: #e9ecef;
            text-align: center;
            line-height: 60px;
            border-radius: 6px;
        }
        .new-book {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        .new-book th, .new-book td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }
        h2, h3 {margin-bottom: 10px; color: #333;}
    </style>
</head>
<body>

<!-- 头部：固定定位 + 浮动 -->
<header class="header">
    <div class="logo">
        <img src="https://ts2.tc.mm.bing.net/th/id/OIP-C.6fxesIOCeQh-1TeZ82a8dQHaFj?rs=1&pid=ImgDetMain&o=7&rm=3" alt="Logo">
    </div>
    <ul class="nav">
        <li>首页</li>
        <li>文学小说</li>
        <li>科技编程</li>
        <li>经济管理</li>
        <li>联系我们</li>
        
        <!-- 新增：搜索 + 购物车图标 -->
        <li><span class="icon">🔍</span>搜索</li>
        <li><span class="icon">🛒</span>购物车</li>
        
        <!-- 只加了点击事件，其他完全不变 -->
        <li onclick="showLogin()">登录</li>
    </ul>
</header>

<!-- 主体容器 -->
<div class="container">

    <!-- 左侧栏：相对定位 -->
    <aside class="left">
        <h2>图书分类</h2>
        <ul class="category">
            <li>计算机图书</li>
            <li>文学名著</li>
            <li>少儿读物</li>
            <li>考试考证</li>
            <li>历史传记</li>
        </ul>
    </aside>

    <!-- 中间内容区 -->
    <main class="middle">
        <!-- 轮播图：从下向上自动轮播 -->
        <div class="carousel">
            <img src="https://picsum.photos/800/250?1" alt="轮播1">
            <img src="https://picsum.photos/800/250?2" alt="轮播2">
            <img src="https://picsum.photos/800/250?3" alt="轮播3">
            <img src="https://picsum.photos/800/250?4" alt="轮播4">
        </div>

        <h2>图书展示区</h2>
        <div class="book-box">
            <!-- 父相子绝：父元素相对定位 -->
            <div class="book-item">
                <img src="https://ts2.tc.mm.bing.net/th/id/OIP-C.Qcioj2UPhuj75jikY2YxrwHaKB?rs=1&pid=ImgDetMain&o=7&rm=3" alt="图书封面">
                <!-- 子元素绝对定位 -->
                <div class="hot-tag">热销</div>
                <!-- 悬停显示 -->
                <div class="show-info">点击查看详情</div>
            </div>
        </div>

        <h2>热门推荐</h2>
        <div class="recommend">
            <div class="rec-item">推荐1</div>
            <div class="rec-item">推荐2</div>
            <div class="rec-item">推荐3</div>
        </div>

        <h2>新书上市</h2>
        <table class="new-book">
            <tr>
                <th>书名</th>
                <th>价格</th>
                <th>出版时间</th>
            </tr>
            <tr>
                <td>HTML从入门到精通</td>
                <td>59元</td>
                <td>2025-01</td>
            </tr>
            <tr>
                <td>CSS实战</td>
                <td>49元</td>
                <td>2025-02</td>
            </tr>
        </table>
    </main>

    <!-- 右侧栏：固定定位 -->
    <aside class="right">
        <h3>促销广告</h3>
        <p>满100减20</p>
        <p>新用户立减10元</p>
    </aside>
</div>

<!-- ================== 登录弹窗（默认隐藏，点击登录才显示） ================== -->
<div class="mask" id="mask"></div>
<div class="login-pop" id="loginPop">
    <div class="login-box" id="loginBox">
        <h2>用户登录</h2>
        <div class="input-item">
            <label>用户名：</label>
            <input type="text" id="loginUser" placeholder="请输入用户名">
        </div>
        <div class="input-item">
            <label>密码：</label>
            <input type="password" id="loginPwd" placeholder="请输入密码">
        </div>
        <div class="btn-box">
            <button onclick="login()">登录</button>
            <button onclick="switchBox('registerBox')">去注册</button>
            <button onclick="closeLogin()">关闭</button>
        </div>
    </div>

    <div class="register-box" id="registerBox">
        <h2>用户注册</h2>
        <div class="input-item">
            <label>用户名：</label>
            <input type="text" id="regUser" placeholder="请设置用户名">
        </div>
        <div class="input-item">
            <label>密码：</label>
            <input type="password" id="regPwd" placeholder="请设置密码">
        </div>
        <div class="btn-box">
            <button onclick="register()">注册</button>
            <button onclick="switchBox('loginBox')">返回登录</button>
            <button onclick="closeLogin()">关闭</button>
        </div>
    </div>
</div>

<script>
// 打开登录弹窗
function showLogin(){
    document.getElementById('mask').style.display='block';
    document.getElementById('loginPop').style.display='block';
    switchBox('loginBox');
}
// 关闭登录弹窗
function closeLogin(){
    document.getElementById('mask').style.display='none';
    document.getElementById('loginPop').style.display='none';
}
// 切换面板
function switchBox(showId){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('registerBox').style.display='none';
    document.getElementById(showId).style.display='block';
}
// 注册
function register(){
    let user=document.getElementById('regUser').value.trim();
    let pwd=document.getElementById('regPwd').value.trim();
    if(!user||!pwd){alert('用户名和密码不能为空！');return;}
    localStorage.setItem('username',user);
    localStorage.setItem('password',pwd);
    alert('注册成功！');
    switchBox('loginBox');
}
// 登录
function login(){
    let user=document.getElementById('loginUser').value.trim();
    let pwd=document.getElementById('loginPwd').value.trim();
    let localUser=localStorage.getItem('username');
    let localPwd=localStorage.getItem('password');
    if(!localUser){alert('请先注册！');switchBox('registerBox');return;}
    if(user===localUser&&pwd===localPwd){
        alert('登录成功！');
        closeLogin();
    }else{
        alert('用户名或密码错误！');
    }
}
</script>
</body>
</html>
